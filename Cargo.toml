[workspace]
members = ["crates/*"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
axum = "0.8.8"
clap = { version = "4.5.54", features = ["derive", "env"] }
config = { version = "0.15.19", default-features = false, features = ["toml"] }
futures-util = { version = "0.3.31", features = ["sink"] }
humantime = "2.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
argon2 = { version = "0.5.3", features = ["std"] }
base64 = "0.22.1"
bytes = "1.11.1"
cap-std = "4.0.2"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
lzokay = "2.0.1"
proptest = "1.9.0"
rand = "0.8.5"
sha2 = "0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
subtle = "2.6.1"
thiserror = "2.0.18"
tokio = { version = "1.49.0", default-features = false, features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", default-features = false, features = ["codec", "rt"] }
toml = "1.0"
uuid = { version = "1.19.0", features = ["v4"] }
unicode-normalization = "0.1.25"
zeroize = { version = "1.8.2", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = "deny"
large_enum_variant = "warn"
needless_collect = "warn"
