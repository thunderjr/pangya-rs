# Local M2 plus opt-in synthetic GameService M5/M6 example. Copy to an ignored local file.
[server]
profile = "local"
shutdown_grace = "10s"

[login]
bind = "127.0.0.1:10103"
advertise = "127.0.0.1:10103"
client_profile = "us_852"
auto_create_accounts = false

[game]
# False preserves the M2-only process. Enabling requires the [data] gates below.
enabled = false
bind = "127.0.0.1:20201"
advertise = "127.0.0.1:20201"
id = 1
name = "PangYa-RS Local"
capacity = 200
channel_id = 1
max_rooms = 1024
lobby_command_capacity = 256
lobby_event_capacity = 256
room_normal_capacity = 64
room_control_capacity = 16
outbound_room_event_capacity = 64
room_commands_per_window = 30
chat_messages_per_window = 10
unknown_opcode_strikes = 3
# Capture retains bounded opcode/state/length metadata plus a SHA-256 digest, never raw payloads.
unknown_capture_capacity = 256
command_timeout = "3s"
# Emits the reference-derived US 852 retail bootstrap instead of the synthetic one.
# Required by a real client; unverified against one, so it stays opt-in.
retail_bootstrap = false

[game.solo_practice]
# Local synthetic protocol only; disabled by default and not retail-compatible.
enabled = false
course_id = 7
# Par for the single hole. Zero means "take it from the catalog", which only the generated
# catalogs can satisfy: a real client's Course.iff is a presentation row with no par field, so
# a real-client catalog requires an explicit value here. Startup fails with an actionable
# message rather than guessing.
course_par = 0
loading_timeout = "30s"
commit_timeout = "3s"
max_strokes = 30
startup_recovery_limit = 1000
shot_packets_per_window = 120

[game.stroke_two]
# Local synthetic exactly-two/one-hole protocol only; disabled and not retail-compatible.
enabled = false
course_id = 7
course_par = 0
loading_timeout = "30s"
turn_timeout = "30s"
game_timeout = "10m"
commit_timeout = "3s"
max_strokes = 30
startup_recovery_limit = 1000
shot_packets_per_window = 120

[game.economy]
# Local synthetic v2 catalog/shop only; disabled and not retail-compatible.
enabled = false
command_timeout = "3s"
commands_per_window = 30
page_size = 50
max_purchase_quantity = 99

[http]
bind = "127.0.0.1:8080"
metrics = true
heartbeat_stale_after = "5s"

# The operator admin API, nested at /admin/v1 on this same listener because its audience is
# the operator — the same audience health and metrics already have.
# See docs/adr/0016-admin-api-on-the-http-listener.md.
#
# Disabled by default: this is the only HTTP surface in the project that can mutate player
# state. Enabling it logs a warning saying so.
#
# The first admin is created out of band, because the API can only grant the role to someone
# who already holds it:
#     pangya-server account role --account-id 1 --role admin
[http.admin_api]
enabled = false
# Capped at 24h by configuration validation; beyond that a forgotten browser tab becomes a
# standing credential.
session_lifetime = "12h"
logins_per_window = 10
rate_window = "60s"
# The panel is a separate service (pangya-admin, port 5173) that proxies /admin/v1 here, so
# the session cookie stays same-origin without CORS. This listener serves no HTML.

# The static HTTP contract a retail client needs before it will speak the game protocol at all:
# a string catalog, the XTEA-encrypted patch updatelist, and the theme documents plus their
# images. Without these the client aborts during startup; see docs/RUNNING_THE_CLIENT.md.
#
# Deliberately a separate listener from [http]: this one has to be reachable by the machine
# running the client, and health/metrics should not be.
[client_web]
enabled = false
bind = "127.0.0.1:8090"
# What the client is told to fetch theme images from. The client resolves this on its own
# machine and passes it to WinINet verbatim, so it must be an address reachable from there.
advertise = "127.0.0.1:8090"
# Selects the updatelist XTEA key: us, jp, th, eu, id, kr.
region = "us"
# The directory holding the client's .pak series. Required when enabled.
# client_directory = "./local-data/us851"
# "paks" lists only the PAK series, which is what the client needs to mount its data.
# "all" mirrors a retail patch server and also lists executables and DLLs.
entries = "paks"
patch_version = "PangYa-RS"
patch_number = 9999
# Plaintext catalog XML; the service base64-encodes it the way the client expects. Operator
# supplied, because the content is the client's own localized strings.
# translation_catalog = "./local-data/us851-data/translation_us.xml"
# Theme images. Point this at the client's own extrares directory; notice, lobby, and loading
# entries are derived from the retail file-naming convention.
# theme_directory = "./local-data/us851/extrares"

[database]
# The URL value itself must only exist in this named environment variable or secret_file.
url_env = "DATABASE_URL"
# secret_file = "/run/secrets/pangya_database_url"
max_connections = 10
min_connections = 1
acquire_timeout = "5s"
connect_attempts = 5
retry_initial = "100ms"
retry_max = "2s"
readiness_probe_interval = "1s"
readiness_probe_timeout = "2s"

[protocol]
max_client_frame_bytes = 65535
max_plaintext_bytes = 8388608
max_expansion_ratio = 128
unknown_opcode_policy = "disconnect"

[logging]
filter = "info,pangya_protocol=debug"
format = "pretty"
packet_bodies = false

[security]
credential_concurrency = 2
credential_queue_timeout = "250ms"
credential_operation_timeout = "5s"
global_connections = 256
connections_per_source = 8
source_capacity = 1024
global_accepts_per_window = 1000
accepts_per_window = 30
global_logins_per_window = 1000
logins_per_window = 10
username_logins_per_window = 10
rate_window = "60s"
global_packets_per_window = 10000
global_bytes_per_window = 16777216
source_packets_per_window = 600
source_bytes_per_window = 2097152
packets_per_window = 60
bytes_per_window = 262144
malformed_strike_cap = 1
max_retries = 3
login_timeout = "15s"
idle_timeout = "120s"

[starter]
# Provisional until M3 validates these IDs against an operator-supplied IFF catalog.
character_key = "starter_character"
character_type_id = 67108864
allowed_character_type_ids = [67108864]
equipped_club_key = "starter_club"
# A client will not take a shot with no ball equipped, so a new account needs one to be
# playable at all. 335544320 is 0x14000000, the first Ball.iff entry.
equipped_ball_key = "starter_ball"

[[starter.items]]
key = "starter_club"
item_type_id = 268435456
quantity = 1

[[starter.items]]
key = "starter_ball"
item_type_id = 335544320
quantity = 1

[data]
# For synthetic M3, iff_directory is the mounted root and manifest is relative to it.
# iff_directory = "./local-data/us852"
# manifest = "manifest.toml"
catalog_required_m3 = false
load_timeout = "5s"
